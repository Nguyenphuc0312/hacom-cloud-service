global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/process5-worker-alerts.yml

scrape_configs:
  - job_name: cloud-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: cloud-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9091
