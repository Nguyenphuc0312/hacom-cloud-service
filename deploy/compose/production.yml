name: ${COMPOSE_PROJECT_NAME:-chat-admin-panel-production}

services:
  chat-admin-panel:
    image: ${CHAT_ADMIN_PANEL_IMAGE:?CHAT_ADMIN_PANEL_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ${SERVER_RUNTIME_ENV_FILE}
    ports:
      - "${CHAT_ADMIN_PANEL_HOST_PORT:-3402}:80"
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      chat-platform:
        aliases:
          - chat-admin-panel

networks:
  chat-platform:
    external: true
    name: chat-platform
