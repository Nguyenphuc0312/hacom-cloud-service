name: ${COMPOSE_PROJECT_NAME:-chat-web-client-server-test}

services:
  chat-web-client:
    image: ${CHAT_WEB_CLIENT_IMAGE:?CHAT_WEB_CLIENT_IMAGE is required}
    restart: unless-stopped
    env_file:
      - ../../.env.runtime
    environment:
      API_UPSTREAM: http://chat-api:3001
      AUTH_UPSTREAM: http://chat-auth:3101
      WS_UPSTREAM: http://chat-websocket:8080
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      chat-platform:
        aliases:
          - chat-web-client

networks:
  chat-platform:
    external: true
    name: chat-platform
