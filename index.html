<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Hacom Holdings</title>
    <script>
      (function () {
        var r = document.documentElement;
        var path = window.location.pathname;
        var isChat = /(^|\/)chat(?:\/|$)/.test(path);
        var isApp =
          /(^|\/)(cloud|friends|friend-discovery|join|calendar|settings|maintenance|tasks|timesheet|leave|ai-assistant|work-report-drafts|archive|notifications|help|faq|tips|report-issue)(?:\/|$)/.test(
            path,
          );
        r.dataset.bootRoute = isChat ? "chat" : isApp ? "app" : "default";
        try {
          var s = JSON.parse(localStorage.getItem("ui-storage") || "{}");
          var st = (s && s.state) || {};
          var theme = ["light", "dark", "system"].includes(st.theme)
            ? st.theme
            : "system";
          var brand = ["blue", "green", "purple"].includes(st.brand)
            ? st.brand
            : "blue";
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          r.dataset.themePreference = theme;
          r.dataset.theme = resolved;
          r.dataset.brand = brand;
          if (resolved === "dark") r.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      #app-boot-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
      }
      [data-theme="dark"] #app-boot-loader {
        background: #0e0f10;
      }
      #app-boot-loader > div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      #app-boot-loader img {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        box-shadow: 0 3px 8px rgb(15 23 42 / 9%);
      }
      #app-boot-loader span {
        position: relative;
        width: 72px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e7eb;
      }
      [data-theme="dark"] #app-boot-loader span {
        background: #27292b;
      }
      #app-boot-loader span::after {
        content: "";
        position: absolute;
        inset-block: 0;
        left: 0;
        width: 100%;
        border-radius: inherit;
        background: #1565c0;
        transform-origin: left;
        animation: app-boot-progress 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes app-boot-progress {
        from {
          opacity: 0.65;
          transform: scaleX(0.16);
        }
        to {
          opacity: 1;
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot-loader span::after {
          opacity: 0.72;
          animation: none;
        }
      }
      #app-boot-chat {
        --boot-canvas: #f1f4f7;
        --boot-surface: #fff;
        --boot-border: #dde3ea;
        --boot-skeleton: #e6e9ed;
        position: fixed;
        inset: 0;
        display: none;
        overflow: hidden;
        background: var(--boot-canvas);
      }
      [data-theme="dark"] #app-boot-chat {
        --boot-canvas: #0e0f10;
        --boot-surface: #181a1c;
        --boot-border: #292c2f;
        --boot-skeleton: #24272a;
      }
      [data-boot-route="chat"] #app-boot-loader,
      [data-boot-route="app"] #app-boot-loader {
        display: none;
      }
      [data-boot-route="chat"] #app-boot-chat,
      [data-boot-route="app"] #app-boot-chat {
        display: flex;
      }
      #app-boot-chat,
      #app-boot-chat * {
        box-sizing: border-box;
        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
      }
      #app-boot-chat .boot-rail {
        display: flex;
        width: 56px;
        min-width: 56px;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 10px 6px;
        border-right: 1px solid #b71c1c !important;
        background: linear-gradient(180deg, #d32f2f, #c41e3a);
      }
      .boot-rail-logo {
        width: 44px;
        height: 44px;
        margin-bottom: 4px;
        padding: 6px;
        border-radius: 14px;
        background: #fff;
        object-fit: contain;
      }
      .boot-rail-item {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgb(255 255 255 / 14%);
      }
      .boot-rail-item:first-of-type {
        background: rgb(255 255 255 / 24%);
      }
      .boot-rail-spacer {
        flex: 1;
      }
      .boot-workspace {
        display: grid;
        min-width: 0;
        flex: 1;
        grid-template-columns: clamp(320px, 22vw, 380px) minmax(0, 1fr);
      }
      #app-boot-chat .boot-sidebar {
        overflow: hidden;
        border-right: 1px solid var(--boot-border) !important;
        background: var(--boot-surface);
      }
      #app-boot-chat .boot-sidebar-head {
        height: 134px;
        padding: 18px 16px;
        border-bottom: 1px solid var(--boot-border) !important;
      }
      .boot-filters {
        display: flex;
        gap: 10px;
        padding: 16px;
      }
      .boot-row {
        display: flex;
        height: 68px;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
      }
      .boot-row-copy {
        min-width: 0;
        flex: 1;
      }
      .boot-main {
        display: flex;
        min-width: 0;
        flex-direction: column;
      }
      #app-boot-chat .boot-header {
        display: flex;
        height: 60px;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        border-bottom: 1px solid var(--boot-border) !important;
        background: var(--boot-surface);
      }
      .boot-header-copy {
        flex: 1;
      }
      .boot-messages {
        flex: 1;
        padding: 20px 12%;
      }
      .boot-message {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 28px 0;
      }
      .boot-message.me {
        justify-content: flex-start;
        flex-direction: row-reverse;
      }
      .boot-bubble {
        width: 46%;
        min-height: 58px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--boot-surface);
      }
      .boot-message.me .boot-bubble {
        width: 38%;
        background: #dfe9f6;
      }
      [data-theme="dark"] .boot-message.me .boot-bubble {
        background: #172638;
      }
      #app-boot-chat .boot-composer {
        display: flex;
        height: 76px;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        border-top: 1px solid var(--boot-border) !important;
        background: var(--boot-surface);
      }
      .boot-sk {
        border-radius: 7px;
        background: var(--boot-skeleton);
      }
      .boot-circle {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 50%;
      }
      .boot-line {
        height: 12px;
      }
      .boot-line + .boot-line {
        margin-top: 9px;
      }
      .boot-app-page {
        display: none;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        background: var(--boot-canvas);
      }
      [data-boot-route="app"] .boot-workspace {
        display: none;
      }
      [data-boot-route="app"] .boot-app-page {
        display: flex;
      }
      .boot-app-head {
        display: flex;
        min-height: 68px;
        align-items: center;
        gap: 16px;
        padding: 12px 28px;
        border-bottom: 1px solid var(--boot-border) !important;
        background: var(--boot-surface);
      }
      .boot-app-head-copy {
        min-width: 0;
        flex: 1;
      }
      .boot-app-body {
        min-height: 0;
        flex: 1;
        padding: 24px;
      }
      .boot-app-panel {
        height: 100%;
        overflow: hidden;
        border: 1px solid var(--boot-border) !important;
        border-radius: 16px;
        background: var(--boot-surface);
      }
      .boot-app-tools {
        display: flex;
        gap: 12px;
        padding: 18px;
        border-bottom: 1px solid var(--boot-border) !important;
      }
      .boot-app-row {
        display: flex;
        min-height: 72px;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--boot-border) !important;
      }
      .boot-app-row-copy {
        min-width: 0;
        flex: 1;
      }
      @media (max-width: 767px) {
        .boot-workspace {
          grid-template-columns: minmax(0, 1fr);
        }
        .boot-main {
          display: none;
        }
        .boot-app-body {
          padding: 14px;
        }
        .boot-app-head {
          padding-inline: 16px;
        }
      }
    </style>
  </head>
