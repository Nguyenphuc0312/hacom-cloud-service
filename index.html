<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%logo.png" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Hacom Holdings</title>
    <script>
      (function () {
        var r = document.documentElement;
        var path = window.location.pathname;
        var isChat = /(^|\/)chat(?:\/|$)/.test(path);
        var isAuthSplit =
          /(^|\/)(login|forgot-password|force-change-password|pending-hr-link)(?:\/|$)/.test(
            path,
          );
        var isAuthCard =
          /(^|\/)(activation|verify-email|reset-password)(?:\/|$)/.test(path);
        var isApp =
          /(^|\/)(cloud|friends|friend-discovery|join|calendar|settings|maintenance|tasks|timesheet|leave|ai-assistant|work-report-drafts|archive|notifications|help|faq|tips|report-issue)(?:\/|$)/.test(
            path,
          );
        r.dataset.bootRoute = isChat
          ? "chat"
          : isApp
            ? "app"
            : isAuthSplit
              ? "auth-split"
              : isAuthCard
                ? "auth-card"
                : "default";
        try {
          var s = JSON.parse(localStorage.getItem("ui-storage") || "{}");
          var st = (s && s.state) || {};
          var theme = ["light", "dark", "system"].includes(st.theme)
            ? st.theme
            : "system";
          var brand = ["blue", "green", "purple"].includes(st.brand)
            ? st.brand
            : "blue";
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          r.dataset.themePreference = theme;
          r.dataset.theme = resolved;
          r.dataset.brand = brand;
          if (resolved === "dark") r.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <style>

      html[data-boot-route="auth-split"] #root,
      html[data-boot-route="auth-card"],
      html[data-boot-route="auth-card"] body,
      html[data-boot-route="auth-card"] #root {

        outline: 0 !important;

        inset: 0;

      #app-boot-loader span {

        width: 72px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e7eb;
      }
      [data-theme="dark"] #app-boot-loader span {

      }
      #app-boot-loader span::after {

        inset-block: 0;
        left: 0;
        width: 100%;
        border-radius: inherit;
        background: #1565c0;
        transform-origin: left;

      }

      }

        border: 0 !important;
        outline: 0 !important;
        box-shadow: none !important;
      }

        display: none;
        width: 50%;
        overflow: hidden;
        background: #111827;
      }
      .boot-auth-visual > img {

        inset: 0;
        width: 100%;
        height: 100%;

      .boot-auth-overlay {

        }

      }
      @media (prefers-reduced-motion: reduce) {
        .boot-auth-sk {
          animation: none;
        }
      }

      #app-boot-chat .boot-composer {

      .boot-app-page {

      .boot-app-head {

        align-items: center;

      .boot-app-body {

        padding: 24px;

      .boot-app-panel {

      }
      .boot-app-tools {
        display: flex;

      .boot-app-row {

        gap: 14px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--boot-border) !important;
      }
      .boot-app-row-copy {
        min-width: 0;
        flex: 1;
      }
      @media (max-width: 767px) {
        .boot-workspace {
          grid-template-columns: minmax(0, 1fr);
        }
        .boot-main {
          display: none;
        }
        .boot-app-body {
          padding: 14px;
        }
        .boot-app-head {
          padding-inline: 16px;
        }
      }
    </style>
  </head>
