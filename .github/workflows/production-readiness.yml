name: production-readiness

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-chat-web-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      SHARED_TYPES_REPO_TOKEN: ${{ secrets.SHARED_TYPES_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: chat-web-client

      - if: ${{ env.SHARED_TYPES_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHARED_TYPES_REPOSITORY || format('{0}/chat-shared-types', github.repository_owner) }}
          path: chat-shared-types
          ref: ${{ vars.SHARED_TYPES_REF || 'main' }}
          token: ${{ env.SHARED_TYPES_REPO_TOKEN }}

      - if: ${{ env.SHARED_TYPES_REPO_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHARED_TYPES_REPOSITORY || format('{0}/chat-shared-types', github.repository_owner) }}
          path: chat-shared-types
          ref: ${{ vars.SHARED_TYPES_REF || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            chat-web-client/package-lock.json
            chat-shared-types/package-lock.json

      - name: Verify shared types package
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ./chat-shared-types
          npm ci --no-audit --no-fund
          npm run contract:check

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ./chat-web-client
          npm ci --no-audit --no-fund

      - name: Run production readiness gate
        shell: bash
        run: |
          set -Eeuo pipefail
          cd ./chat-web-client
          npm run ci:readiness

