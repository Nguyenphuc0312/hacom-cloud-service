name: Chat Web staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-web-staging-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          path: chat-web-client
      - uses: actions/checkout@v4
        with:
          repository: hacom-holding-dx/chat-shared-types
          path: chat-shared-types
          token: ${{ secrets.SHARED_TYPES_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            chat-web-client/package-lock.json
            chat-shared-types/package-lock.json
      - run: npm ci
        working-directory: chat-shared-types
      - run: npm ci
        working-directory: chat-web-client
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: chat-web-client

  publish:
    needs: verify
    if: ${{ vars.STAGING_CONTRACT_ACTIVE == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: chat-web-client
      - uses: actions/checkout@v4
        with:
          repository: hacom-holding-dx/chat-shared-types
          path: chat-shared-types
          token: ${{ secrets.SHARED_TYPES_REPO_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: chat-web-client/Dockerfile
          target: production
          push: true
          tags: ghcr.io/hacom-holding-dx/chat-web-client:${{ github.sha }}
      - id: image
        run: echo "image=ghcr.io/hacom-holding-dx/chat-web-client@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: ${{ vars.STAGING_CONTRACT_ACTIVE == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, chat-staging, deploy-only]
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Roll out the pinned image in staging
        env:
          CHAT_WEB_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -eu
          export KUBECONFIG="$HOME/.kube/hacom-chat-staging-config"
          test -f "$KUBECONFIG"
          case "$CHAT_WEB_IMAGE" in ghcr.io/hacom-holding-dx/chat-web-client@sha256:*) ;; *) exit 1 ;; esac
          kubectl set image deployment/chat-web chat-web="$CHAT_WEB_IMAGE" -n hacom-chat
          kubectl rollout status deployment/chat-web -n hacom-chat --timeout=180s
