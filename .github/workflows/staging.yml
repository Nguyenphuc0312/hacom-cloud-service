name: Chat Web staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-web-staging-deploy
  cancel-in-progress: false

jobs:
  staging-contract-preflight:
    # The Chat staging runner and its restricted kubeconfig are currently
    # owned by this repository. Do not infer backend workload names from the
    # web deployment; inventory the existing staging contract first.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop' }}
    runs-on: [self-hosted, linux, x64, chat-staging, deploy-only]
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Verify the restricted Chat staging target
        shell: bash
        run: |
          set -Eeuo pipefail
          export KUBECONFIG="$HOME/.kube/hacom-chat-staging-config"
          test -f "$KUBECONFIG"
          kubectl config current-context
          kubectl get namespace hacom-chat
          kubectl auth can-i get deployments -n hacom-chat | grep -qx yes
          kubectl auth can-i get services -n hacom-chat | grep -qx yes
      - name: Inventory existing Chat staging workloads
        shell: bash
        run: |
          set -Eeuo pipefail
          export KUBECONFIG="$HOME/.kube/hacom-chat-staging-config"
          kubectl get deployments -n hacom-chat \
            -o='custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,IMAGES:.spec.template.spec.containers[*].image'
          kubectl get services -n hacom-chat \
            -o='custom-columns=NAME:.metadata.name,TYPE:.spec.type,PORTS:.spec.ports[*].port'

  verify:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          path: chat-web-client
      - uses: actions/checkout@v5
        with:
          repository: hacom-holding-dx/chat-shared-types
          path: chat-shared-types
          token: ${{ secrets.SHARED_TYPES_REPO_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            chat-web-client/package-lock.json
            chat-shared-types/package-lock.json
      - run: npm ci
        working-directory: chat-shared-types
      - run: npm run build
        working-directory: chat-shared-types
      - run: npm ci
        working-directory: chat-web-client
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: chat-web-client

  publish:
    needs: verify
    if: ${{ vars.STAGING_CONTRACT_ACTIVE == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: chat-web-client
      - uses: actions/checkout@v5
        with:
          repository: hacom-holding-dx/chat-shared-types
          path: chat-shared-types
          token: ${{ secrets.SHARED_TYPES_REPO_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve file viewer rollout flags
        id: rollout_flags
        shell: bash
        env:
          VITE_FILE_VIEWER_ENABLED: ${{ vars.VITE_FILE_VIEWER_ENABLED }}
          VITE_FILE_LIFECYCLE_TELEMETRY_ENABLED: ${{ vars.VITE_FILE_LIFECYCLE_TELEMETRY_ENABLED }}
        run: |
          set -Eeuo pipefail
          resolve_flag() {
            local name="$1"
            local value
            value="$(printf '%s' "${2:-}" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [[ -n "${value}" ]] || value="false"
            case "${value}" in
              true|false) printf '%s' "${value}" ;;
              *)
                echo "::error title=Invalid boolean flag::${name} must be 'true' or 'false', got '${value}'" >&2
                return 1
                ;;
            esac
          }
          file_viewer="$(resolve_flag VITE_FILE_VIEWER_ENABLED "${VITE_FILE_VIEWER_ENABLED:-}")"
          lifecycle_telemetry="$(resolve_flag VITE_FILE_LIFECYCLE_TELEMETRY_ENABLED "${VITE_FILE_LIFECYCLE_TELEMETRY_ENABLED:-}")"
          printf 'file_viewer=%s\n' "${file_viewer}" >> "${GITHUB_OUTPUT}"
          printf 'lifecycle_telemetry=%s\n' "${lifecycle_telemetry}" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: chat-web-client/Dockerfile
          target: production
          push: true
          tags: ghcr.io/hacom-holding-dx/chat-web-client:${{ github.sha }}
          build-args: |
            VITE_FILE_VIEWER_ENABLED=${{ steps.rollout_flags.outputs.file_viewer }}
            VITE_FILE_LIFECYCLE_TELEMETRY_ENABLED=${{ steps.rollout_flags.outputs.lifecycle_telemetry }}
      - id: image
        run: echo "image=ghcr.io/hacom-holding-dx/chat-web-client@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    if: ${{ vars.STAGING_CONTRACT_ACTIVE == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, chat-staging, deploy-only]
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Roll out the pinned image in staging
        env:
          CHAT_WEB_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -eu
          export KUBECONFIG="$HOME/.kube/hacom-chat-staging-config"
          test -f "$KUBECONFIG"
          case "$CHAT_WEB_IMAGE" in ghcr.io/hacom-holding-dx/chat-web-client@sha256:*) ;; *) exit 1 ;; esac
          kubectl set image deployment/chat-web chat-web="$CHAT_WEB_IMAGE" -n hacom-chat
          kubectl rollout status deployment/chat-web -n hacom-chat --timeout=180s
