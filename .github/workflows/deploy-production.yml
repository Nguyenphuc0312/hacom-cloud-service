name: deploy-production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag/SHA to deploy (leave empty to build from HEAD). Use a previous SHA for rollback."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-chat-web-client
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SHARED_TYPES_REPO_TOKEN: ${{ secrets.SHARED_TYPES_REPO_TOKEN }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME != '' && secrets.GHCR_PULL_USERNAME || github.repository_owner }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: chat-web-client

      - if: ${{ env.SHARED_TYPES_REPO_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHARED_TYPES_REPOSITORY || format('{0}/chat-shared-types', github.repository_owner) }}
          path: chat-shared-types
          ref: ${{ vars.SHARED_TYPES_REF || 'main' }}
          token: ${{ env.SHARED_TYPES_REPO_TOKEN }}

      - if: ${{ env.SHARED_TYPES_REPO_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHARED_TYPES_REPOSITORY || format('{0}/chat-shared-types', github.repository_owner) }}
          path: chat-shared-types
          ref: ${{ vars.SHARED_TYPES_REF || 'main' }}

      - name: Validate deploy inputs
        id: validate_inputs
        env:
          SERVER_APPS_ROOT: ${{ vars.SERVER_APPS_ROOT }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          VITE_APP_BASE_PATH: ${{ vars.VITE_APP_BASE_PATH }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_AUTH_BASE_URL: ${{ vars.VITE_AUTH_BASE_URL }}
          VITE_USE_AUTH_SERVICE: ${{ vars.VITE_USE_AUTH_SERVICE }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_WS_USE_QUERY_TOKEN: ${{ vars.VITE_WS_USE_QUERY_TOKEN }}
          VITE_WS_AUTO_QUERY_TOKEN_FALLBACK: ${{ vars.VITE_WS_AUTO_QUERY_TOKEN_FALLBACK }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          GHCR_PULL_USERNAME: ${{ env.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ env.GHCR_PULL_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail

          trim() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          require() {
            local v; v="$(trim "${2}")"
            [[ -n "${v}" ]] || { echo "::error::${1} is required"; exit 1; }
            printf '%s' "${v}"
          }

          SERVER_APPS_ROOT_CLEAN="$(require "vars.SERVER_APPS_ROOT" "${SERVER_APPS_ROOT}")"
          SERVICE_NAME_CLEAN="$(require "vars.SERVICE_NAME" "${SERVICE_NAME}")"
          DEPLOY_ENV_CLEAN="$(require "vars.DEPLOY_ENV" "${DEPLOY_ENV}")"
          SERVER_PORT_CLEAN="$(require "secrets.SERVER_PORT" "${SERVER_PORT}")"
          SERVER_USER_CLEAN="$(require "secrets.SERVER_USER" "${SERVER_USER}")"
          SERVER_HOST_CLEAN="$(require "secrets.SERVER_HOST" "${SERVER_HOST}")"
          GHCR_PULL_USERNAME_CLEAN="$(require "GHCR_PULL_USERNAME" "${GHCR_PULL_USERNAME}")"
          GHCR_PULL_TOKEN_CLEAN="$(require "secrets.GHCR_PULL_TOKEN" "${GHCR_PULL_TOKEN}")"

          if [ "${DEPLOY_ENV_CLEAN}" != "production" ]; then
            echo "::error::vars.DEPLOY_ENV must be 'production'. Got: '${DEPLOY_ENV_CLEAN}'"
            exit 1
          fi

          [[ -n "$(trim "${SERVER_SSH_KEY}")" ]] || { echo "::error::SERVER_SSH_KEY is required"; exit 1; }
          [[ -n "$(trim "${SERVER_SSH_KNOWN_HOSTS}")" ]] || { echo "::error::SERVER_SSH_KNOWN_HOSTS is required"; exit 1; }

          IMAGE_OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          USE_TAG="${INPUT_IMAGE_TAG:-${GITHUB_SHA}}"
          IMAGE_REF="ghcr.io/${IMAGE_OWNER}/chat-web-client:${USE_TAG}"
          RELEASE_DIR="${SERVER_APPS_ROOT_CLEAN}/${SERVICE_NAME_CLEAN}/releases/${USE_TAG}"

          HEALTHCHECK_URL_CLEAN="$(trim "${HEALTHCHECK_URL}")"; [[ -n "${HEALTHCHECK_URL_CLEAN}" ]] || HEALTHCHECK_URL_CLEAN="http://127.0.0.1/healthz"
          VITE_APP_BASE_PATH_CLEAN="$(trim "${VITE_APP_BASE_PATH}")"; [[ -n "${VITE_APP_BASE_PATH_CLEAN}" ]] || VITE_APP_BASE_PATH_CLEAN="/"
          VITE_API_BASE_URL_CLEAN="$(trim "${VITE_API_BASE_URL}")"; [[ -n "${VITE_API_BASE_URL_CLEAN}" ]] || VITE_API_BASE_URL_CLEAN="/api/v1"
          VITE_AUTH_BASE_URL_CLEAN="$(trim "${VITE_AUTH_BASE_URL}")"; [[ -n "${VITE_AUTH_BASE_URL_CLEAN}" ]] || VITE_AUTH_BASE_URL_CLEAN="/api/v1/auth"
          VITE_USE_AUTH_SERVICE_CLEAN="$(trim "${VITE_USE_AUTH_SERVICE}")"; [[ -n "${VITE_USE_AUTH_SERVICE_CLEAN}" ]] || VITE_USE_AUTH_SERVICE_CLEAN="true"
          VITE_WS_URL_CLEAN="$(trim "${VITE_WS_URL}")"; [[ -n "${VITE_WS_URL_CLEAN}" ]] || VITE_WS_URL_CLEAN="/ws"
          VITE_WS_USE_QUERY_TOKEN_CLEAN="$(trim "${VITE_WS_USE_QUERY_TOKEN}")"; [[ -n "${VITE_WS_USE_QUERY_TOKEN_CLEAN}" ]] || VITE_WS_USE_QUERY_TOKEN_CLEAN="false"
          VITE_WS_AUTO_QUERY_TOKEN_FALLBACK_CLEAN="$(trim "${VITE_WS_AUTO_QUERY_TOKEN_FALLBACK}")"; [[ -n "${VITE_WS_AUTO_QUERY_TOKEN_FALLBACK_CLEAN}" ]] || VITE_WS_AUTO_QUERY_TOKEN_FALLBACK_CLEAN="true"

          {
            printf 'SERVER_APPS_ROOT_CLEAN=%s\n' "${SERVER_APPS_ROOT_CLEAN}"
            printf 'SERVICE_NAME_CLEAN=%s\n' "${SERVICE_NAME_CLEAN}"
            printf 'DEPLOY_ENV_CLEAN=%s\n' "${DEPLOY_ENV_CLEAN}"
            printf 'SERVER_PORT_CLEAN=%s\n' "${SERVER_PORT_CLEAN}"
            printf 'SERVER_USER_CLEAN=%s\n' "${SERVER_USER_CLEAN}"
            printf 'SERVER_HOST_CLEAN=%s\n' "${SERVER_HOST_CLEAN}"
            printf 'GHCR_PULL_USERNAME_CLEAN=%s\n' "${GHCR_PULL_USERNAME_CLEAN}"
            printf 'GHCR_PULL_TOKEN_CLEAN=%s\n' "${GHCR_PULL_TOKEN_CLEAN}"
            printf 'HEALTHCHECK_URL_CLEAN=%s\n' "${HEALTHCHECK_URL_CLEAN}"
            printf 'VITE_APP_BASE_PATH_CLEAN=%s\n' "${VITE_APP_BASE_PATH_CLEAN}"
            printf 'VITE_API_BASE_URL_CLEAN=%s\n' "${VITE_API_BASE_URL_CLEAN}"
            printf 'VITE_AUTH_BASE_URL_CLEAN=%s\n' "${VITE_AUTH_BASE_URL_CLEAN}"
            printf 'VITE_USE_AUTH_SERVICE_CLEAN=%s\n' "${VITE_USE_AUTH_SERVICE_CLEAN}"
            printf 'VITE_WS_URL_CLEAN=%s\n' "${VITE_WS_URL_CLEAN}"
            printf 'VITE_WS_USE_QUERY_TOKEN_CLEAN=%s\n' "${VITE_WS_USE_QUERY_TOKEN_CLEAN}"
            printf 'VITE_WS_AUTO_QUERY_TOKEN_FALLBACK_CLEAN=%s\n' "${VITE_WS_AUTO_QUERY_TOKEN_FALLBACK_CLEAN}"
            printf 'IMAGE_REF=%s\n' "${IMAGE_REF}"
            printf 'RELEASE_DIR=%s\n' "${RELEASE_DIR}"
            printf 'USE_TAG=%s\n' "${USE_TAG}"
          } >> "${GITHUB_ENV}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push runtime image
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file ./chat-web-client/Dockerfile \
            --target production \
            --platform linux/amd64 \
            --progress plain \
            --build-arg VITE_APP_BUILD_SHA="${GITHUB_SHA}" \
            --build-arg VITE_APP_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VITE_APP_BASE_PATH="${VITE_APP_BASE_PATH_CLEAN}" \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL_CLEAN}" \
            --build-arg VITE_AUTH_BASE_URL="${VITE_AUTH_BASE_URL_CLEAN}" \
            --build-arg VITE_USE_AUTH_SERVICE="${VITE_USE_AUTH_SERVICE_CLEAN}" \
            --build-arg VITE_WS_URL="${VITE_WS_URL_CLEAN}" \
            --build-arg VITE_WS_USE_QUERY_TOKEN="${VITE_WS_USE_QUERY_TOKEN_CLEAN}" \
            --build-arg VITE_WS_AUTO_QUERY_TOKEN_FALLBACK="${VITE_WS_AUTO_QUERY_TOKEN_FALLBACK_CLEAN}" \
            --tag "${IMAGE_REF}" \
            --push \
            .

      - name: Verify pushed manifest
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}"

      - name: Prepare release bundle
        working-directory: ./chat-web-client
        run: |
          set -Eeuo pipefail
          mkdir -p .release-bundle/deploy
          cp -R deploy/compose .release-bundle/deploy/
          cp -R deploy/scripts .release-bundle/deploy/
          cp deploy/README.md .release-bundle/deploy/README.md

          {
            printf 'CHAT_WEB_CLIENT_IMAGE=%q\n' "${IMAGE_REF}"
            printf 'IMAGE_REF=%q\n' "${IMAGE_REF}"
            printf 'RELEASE_SHA=%q\n' "${USE_TAG}"
            printf 'SERVICE_NAME=%q\n' "${SERVICE_NAME_CLEAN}"
            printf 'DEPLOY_ENV=%q\n' "${DEPLOY_ENV_CLEAN}"
            printf 'COMPOSE_PROJECT_NAME=%q\n' "chat-web-client-${DEPLOY_ENV_CLEAN}"
            printf 'COMPOSE_FILE=%q\n' "deploy/compose/${DEPLOY_ENV_CLEAN}.yml"
            printf 'RUNTIME_SERVICE=%q\n' "chat-web-client"
            printf 'MIGRATE_ENABLED=%q\n' "false"
            printf 'HEALTHCHECK_URL=%q\n' "${HEALTHCHECK_URL_CLEAN}"
          } > .release-bundle/.release.env

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Configure known_hosts, rsync, deploy
        id: deploy_remote
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          PORT="${SERVER_PORT_CLEAN}"
          ssh -p "${PORT}" "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}" \
            "mkdir -p '${RELEASE_DIR}'"
          rsync -az --delete \
            -e "ssh -p ${PORT}" \
            ./chat-web-client/.release-bundle/ \
            "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}:${RELEASE_DIR}/"
          ssh -p "${PORT}" "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}" <<EOF
          set -eu
          cd "${RELEASE_DIR}"
          echo "${GHCR_PULL_TOKEN_CLEAN}" | docker login ghcr.io -u "${GHCR_PULL_USERNAME_CLEAN}" --password-stdin
          chmod +x deploy/scripts/deploy.sh deploy/scripts/rollback.sh
          ./deploy/scripts/deploy.sh
          EOF

      - name: Show remote logs on failure
        if: ${{ failure() && steps.validate_inputs.outcome == 'success' && steps.deploy_remote.outcome == 'failure' }}
        run: |
          set +e
          [ -n "${SERVER_PORT_CLEAN:-}" ] || exit 0
          ssh -p "${SERVER_PORT_CLEAN}" "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}" <<EOF
          set +e
          cd "${RELEASE_DIR}" || exit 0
          [ -f ./.release.env ] || exit 0
          set -a; . ./.release.env; set +a
          docker compose -f "${COMPOSE_FILE}" ps || true
          docker compose -f "${COMPOSE_FILE}" logs --tail=200 chat-web-client || true
          EOF
