name: deploy-production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag/SHA to deploy (rollback). Leave empty to build from HEAD."
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      SERVER_APPS_ROOT: ${{ vars.SERVER_APPS_ROOT }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: chat-admin-panel

      - name: Resolve image tag
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag || '' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            echo "IMAGE_TAG=${INPUT_IMAGE_TAG}" >> "$GITHUB_ENV"
            echo "SKIP_BUILD=true" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "SKIP_BUILD=false" >> "$GITHUB_ENV"
          fi
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chat-admin-panel:${INPUT_IMAGE_TAG:-${GITHUB_SHA}}" >> "$GITHUB_ENV"

      - name: Debug configuration presence
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          for var in DEPLOY_ENV SERVER_HOST SERVER_PORT SERVER_USER SERVER_SSH_KEY SERVER_SSH_KNOWN_HOSTS GHCR_PULL_USERNAME GHCR_PULL_TOKEN SERVER_APPS_ROOT HEALTHCHECK_URL SERVICE_NAME; do
            if [ -n "${!var:-}" ]; then
              echo "${var}=SET"
            else
              echo "${var}=MISSING"
            fi
          done

      - name: Validate deploy inputs
        id: validate_inputs
        env:
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          VITE_ADMIN_API_ROOT: ${{ vars.VITE_ADMIN_API_ROOT }}
          VITE_ADMIN_API_BASE_URL: ${{ vars.VITE_ADMIN_API_BASE_URL }}
          VITE_AUTH_BASE_URL: ${{ vars.VITE_AUTH_BASE_URL }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_DASHBOARD_REFETCH_INTERVAL_MS: ${{ vars.VITE_DASHBOARD_REFETCH_INTERVAL_MS }}
          VITE_ADMIN_WRITE_ACTIONS_ENABLED: ${{ vars.VITE_ADMIN_WRITE_ACTIONS_ENABLED }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          trim_single_line() {
            printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          }

          require_single_line() {
            local name="$1"
            local raw_value="$2"
            local cleaned_value
            cleaned_value="$(trim_single_line "${raw_value}")"
            if [[ -z "${cleaned_value}" ]]; then
              echo "::error title=Missing required input::${name} is required"
              exit 1
            fi
            printf '%s' "${cleaned_value}"
          }

          require_multiline() {
            local name="$1"
            local raw_value="$2"
            local cleaned_value
            cleaned_value="$(printf '%s' "${raw_value}" | tr -d '\r')"
            if [[ -z "${cleaned_value}" ]]; then
              echo "::error title=Missing required input::${name} is required"
              exit 1
            fi
          }

          require_file() {
            local path="$1"
            if [[ ! -f "${path}" ]]; then
              echo "::error title=Missing required file::${path} was not found"
              exit 1
            fi
          }

          SERVER_APPS_ROOT_CLEAN="$(require_single_line "vars.SERVER_APPS_ROOT" "${SERVER_APPS_ROOT}")"
          SERVICE_NAME_CLEAN="$(require_single_line "vars.SERVICE_NAME" "${SERVICE_NAME}")"
          DEPLOY_ENV_CLEAN="$(require_single_line "vars.DEPLOY_ENV" "${DEPLOY_ENV}")"
          SERVER_PORT_CLEAN="$(require_single_line "secrets.SERVER_PORT" "${SERVER_PORT}")"
          SERVER_USER_CLEAN="$(require_single_line "secrets.SERVER_USER" "${SERVER_USER}")"
          SERVER_HOST_CLEAN="$(require_single_line "secrets.SERVER_HOST" "${SERVER_HOST}")"
          require_single_line "secrets.GHCR_PULL_USERNAME" "${GHCR_PULL_USERNAME}" >/dev/null
          require_single_line "secrets.GHCR_PULL_TOKEN" "${GHCR_PULL_TOKEN}" >/dev/null
          HEALTHCHECK_URL_CLEAN="$(trim_single_line "${HEALTHCHECK_URL}")"
          VITE_ADMIN_API_ROOT_CLEAN="$(trim_single_line "${VITE_ADMIN_API_ROOT}")"
          VITE_ADMIN_API_BASE_URL_CLEAN="$(trim_single_line "${VITE_ADMIN_API_BASE_URL}")"
          VITE_AUTH_BASE_URL_CLEAN="$(trim_single_line "${VITE_AUTH_BASE_URL}")"
          VITE_APP_ENV_CLEAN="$(trim_single_line "${VITE_APP_ENV}")"
          VITE_DASHBOARD_REFETCH_INTERVAL_MS_CLEAN="$(trim_single_line "${VITE_DASHBOARD_REFETCH_INTERVAL_MS}")"
          VITE_ADMIN_WRITE_ACTIONS_ENABLED_CLEAN="$(trim_single_line "${VITE_ADMIN_WRITE_ACTIONS_ENABLED}")"

          if [[ -z "${HEALTHCHECK_URL_CLEAN}" ]]; then
            HEALTHCHECK_URL_CLEAN="http://127.0.0.1/healthz"
          fi
          if [[ -z "${VITE_ADMIN_API_ROOT_CLEAN}" ]]; then
            VITE_ADMIN_API_ROOT_CLEAN="/api/v1/admin"
          fi
          if [[ -z "${VITE_ADMIN_API_BASE_URL_CLEAN}" ]]; then
            VITE_ADMIN_API_BASE_URL_CLEAN="${VITE_ADMIN_API_ROOT_CLEAN}"
          fi
          if [[ -z "${VITE_AUTH_BASE_URL_CLEAN}" ]]; then
            VITE_AUTH_BASE_URL_CLEAN="/api/v1/auth"
          fi
          if [[ -z "${VITE_APP_ENV_CLEAN}" ]]; then
            VITE_APP_ENV_CLEAN="PRODUCTION"
          fi
          if [[ -z "${VITE_DASHBOARD_REFETCH_INTERVAL_MS_CLEAN}" ]]; then
            VITE_DASHBOARD_REFETCH_INTERVAL_MS_CLEAN="15000"
          fi
          if [[ -z "${VITE_ADMIN_WRITE_ACTIONS_ENABLED_CLEAN}" ]]; then
            echo "::error title=Missing required input::vars.VITE_ADMIN_WRITE_ACTIONS_ENABLED is required (true or false)"
            exit 1
          fi
          if [[ "${VITE_ADMIN_WRITE_ACTIONS_ENABLED_CLEAN}" != "true" && "${VITE_ADMIN_WRITE_ACTIONS_ENABLED_CLEAN}" != "false" ]]; then
            echo "::error title=Invalid input::vars.VITE_ADMIN_WRITE_ACTIONS_ENABLED must be true or false"
            exit 1
          fi
          if [[ "${VITE_ADMIN_API_ROOT_CLEAN}" != "${VITE_ADMIN_API_BASE_URL_CLEAN}" ]]; then
            echo "::error title=Invalid input::vars.VITE_ADMIN_API_ROOT and vars.VITE_ADMIN_API_BASE_URL must resolve to the same admin root"
            exit 1
          fi

          require_multiline "secrets.SERVER_SSH_KEY" "${SERVER_SSH_KEY}"
          require_multiline "secrets.SERVER_SSH_KNOWN_HOSTS" "${SERVER_SSH_KNOWN_HOSTS}"

          if [ "${DEPLOY_ENV_CLEAN}" != "production" ]; then
            echo "DEPLOY_ENV must be production"
            exit 1
          fi
          if ! [[ "${SERVER_PORT_CLEAN}" =~ ^[0-9]+$ ]]; then
            echo "SERVER_PORT secret must be digits only"
            exit 1
          fi

          RELEASE_DIR="${SERVER_APPS_ROOT_CLEAN}/${SERVICE_NAME_CLEAN}/releases/${IMAGE_TAG}"

          require_file ./chat-admin-panel/Dockerfile
          require_file ./chat-admin-panel/package-lock.json
          require_file ./chat-admin-panel/nginx/default.conf.template
          require_file ./chat-admin-panel/scripts/verify-dist-assets.mjs
          require_file "./chat-admin-panel/deploy/compose/${DEPLOY_ENV_CLEAN}.yml"
          require_file ./chat-admin-panel/deploy/scripts/deploy.sh
          require_file ./chat-admin-panel/deploy/scripts/rollback.sh

          {
            printf 'SERVER_APPS_ROOT_CLEAN=%s\n' "${SERVER_APPS_ROOT_CLEAN}"
            printf 'SERVICE_NAME_CLEAN=%s\n' "${SERVICE_NAME_CLEAN}"
            printf 'DEPLOY_ENV_CLEAN=%s\n' "${DEPLOY_ENV_CLEAN}"
            printf 'SERVER_PORT_CLEAN=%s\n' "${SERVER_PORT_CLEAN}"
            printf 'SERVER_USER_CLEAN=%s\n' "${SERVER_USER_CLEAN}"
            printf 'SERVER_HOST_CLEAN=%s\n' "${SERVER_HOST_CLEAN}"
            printf 'HEALTHCHECK_URL_CLEAN=%s\n' "${HEALTHCHECK_URL_CLEAN}"
            printf 'VITE_ADMIN_API_ROOT_CLEAN=%s\n' "${VITE_ADMIN_API_ROOT_CLEAN}"
            printf 'VITE_ADMIN_API_BASE_URL_CLEAN=%s\n' "${VITE_ADMIN_API_BASE_URL_CLEAN}"
            printf 'VITE_AUTH_BASE_URL_CLEAN=%s\n' "${VITE_AUTH_BASE_URL_CLEAN}"
            printf 'VITE_APP_ENV_CLEAN=%s\n' "${VITE_APP_ENV_CLEAN}"
            printf 'VITE_DASHBOARD_REFETCH_INTERVAL_MS_CLEAN=%s\n' "${VITE_DASHBOARD_REFETCH_INTERVAL_MS_CLEAN}"
            printf 'VITE_ADMIN_WRITE_ACTIONS_ENABLED_CLEAN=%s\n' "${VITE_ADMIN_WRITE_ACTIONS_ENABLED_CLEAN}"
            printf 'IMAGE_REF=%s\n' "${IMAGE_REF}"
            printf 'RELEASE_DIR=%s\n' "${RELEASE_DIR}"
            printf 'USE_TAG=%s\n' "${IMAGE_TAG}"
          } >> "${GITHUB_ENV}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push runtime image
        if: env.SKIP_BUILD == 'false'
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --file ./chat-admin-panel/Dockerfile \
            --target production \
            --platform linux/amd64 \
            --progress plain \
            --build-arg VITE_ADMIN_API_ROOT="${VITE_ADMIN_API_ROOT_CLEAN}" \
            --build-arg VITE_ADMIN_API_BASE_URL="${VITE_ADMIN_API_BASE_URL_CLEAN}" \
            --build-arg VITE_AUTH_BASE_URL="${VITE_AUTH_BASE_URL_CLEAN}" \
            --build-arg VITE_APP_ENV="${VITE_APP_ENV_CLEAN}" \
            --build-arg VITE_DASHBOARD_REFETCH_INTERVAL_MS="${VITE_DASHBOARD_REFETCH_INTERVAL_MS_CLEAN}" \
            --build-arg VITE_ADMIN_WRITE_ACTIONS_ENABLED="${VITE_ADMIN_WRITE_ACTIONS_ENABLED_CLEAN}" \
            --tag "${IMAGE_REF}" \
            --push \
            ./chat-admin-panel

      - name: Verify built image contents
        if: env.SKIP_BUILD == 'false'
        run: |
          set -Eeuo pipefail
          trap 'docker rm -f chat-admin-panel-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --name chat-admin-panel-smoke -p 18080:80 "${IMAGE_REF}" >/dev/null

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          ROOT_HEADERS="$(mktemp)"
          ROOT_HTML="$(mktemp)"
          JS_HEADERS="$(mktemp)"
          CSS_HEADERS="$(mktemp)"
          MISSING_HEADERS="$(mktemp)"

          curl -fsS -D "${ROOT_HEADERS}" http://127.0.0.1:18080/ -o "${ROOT_HTML}"
          grep -Eiq '^cache-control: no-store, no-cache, must-revalidate' "${ROOT_HEADERS}"

          MAIN_JS="$(grep -oE '/assets/[^"]+\.js' "${ROOT_HTML}" | head -n 1)"
          MAIN_CSS="$(grep -oE '/assets/[^"]+\.css' "${ROOT_HTML}" | head -n 1)"
          test -n "${MAIN_JS}"
          test -n "${MAIN_CSS}"

          curl -fsSI -D "${JS_HEADERS}" "http://127.0.0.1:18080${MAIN_JS}" >/dev/null
          curl -fsSI -D "${CSS_HEADERS}" "http://127.0.0.1:18080${MAIN_CSS}" >/dev/null

          grep -Eiq '^content-type: (application|text)/(x-)?javascript' "${JS_HEADERS}"
          grep -Eiq '^content-type: text/css' "${CSS_HEADERS}"
          grep -Eiq '^cache-control: public, max-age=31536000, immutable' "${CSS_HEADERS}"

          MISSING_STATUS="$(curl -sS -o /dev/null -D "${MISSING_HEADERS}" -w '%{http_code}' http://127.0.0.1:18080/assets/__missing__.css)"
          test "${MISSING_STATUS}" = "404"
          ! grep -Eiq '^content-type: text/html' "${MISSING_HEADERS}"

      - name: Verify pushed manifest
        run: |
          set -Eeuo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_REF}" | awk '/Digest:/ {print $2; exit}')"
          test -n "${DIGEST}"
          echo "IMAGE_DIGEST=${DIGEST}" >> "${GITHUB_ENV}"

      - name: Prepare release bundle
        working-directory: ./chat-admin-panel
        run: |
          set -Eeuo pipefail
          mkdir -p .release-bundle/deploy
          cp -R deploy/compose .release-bundle/deploy/
          cp -R deploy/scripts .release-bundle/deploy/
          cp deploy/README.md .release-bundle/deploy/README.md

          {
            printf 'CHAT_ADMIN_PANEL_IMAGE=%q\n' "${IMAGE_REF}"
            printf 'IMAGE_REF=%q\n' "${IMAGE_REF}"
            printf 'IMAGE_DIGEST=%q\n' "${IMAGE_DIGEST:-}"
            printf 'RELEASE_SHA=%q\n' "${USE_TAG}"
            printf 'SERVICE_NAME=%q\n' "${SERVICE_NAME_CLEAN}"
            printf 'DEPLOY_ENV=%q\n' "${DEPLOY_ENV_CLEAN}"
            printf 'COMPOSE_PROJECT_NAME=%q\n' "chat-admin-panel-${DEPLOY_ENV_CLEAN}"
            printf 'COMPOSE_FILE=%q\n' "deploy/compose/${DEPLOY_ENV_CLEAN}.yml"
            printf 'RUNTIME_SERVICE=%q\n' "chat-admin-panel"
            printf 'MIGRATE_ENABLED=%q\n' "false"
            printf 'HEALTHCHECK_URL=%q\n' "${HEALTHCHECK_URL_CLEAN}"
          } > .release-bundle/.release.env

      - name: Set up SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SERVER_SSH_KNOWN_HOSTS}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Configure known_hosts, rsync, deploy
        id: deploy_remote
        run: |
          set -Eeuo pipefail
          PORT="${SERVER_PORT_CLEAN}"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${PORT}" "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}" \
            "mkdir -p '${RELEASE_DIR}'"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p ${PORT}" \
            ./chat-admin-panel/.release-bundle/ \
            "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}:${RELEASE_DIR}/"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${PORT}" "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}" <<EOF
          set -eu
          cd "${RELEASE_DIR}"
          echo "${GHCR_PULL_TOKEN}" | docker login ghcr.io -u "${GHCR_PULL_USERNAME}" --password-stdin
          chmod +x deploy/scripts/deploy.sh deploy/scripts/rollback.sh
          ./deploy/scripts/deploy.sh
          EOF

      - name: Show remote logs on failure
        if: ${{ failure() && steps.validate_inputs.outcome == 'success' &&
          steps.deploy_remote.outcome == 'failure' }}
        run: |
          set +e
          if [[ -z "${SERVER_PORT_CLEAN:-}" || -z "${SERVER_USER_CLEAN:-}" || -z "${SERVER_HOST_CLEAN:-}" || -z "${RELEASE_DIR:-}" ]]; then
            echo "Skipping remote logs because deploy connection variables are unavailable."
            exit 0
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${SERVER_PORT_CLEAN}" "${SERVER_USER_CLEAN}@${SERVER_HOST_CLEAN}" <<EOF
          set +e
          cd "${RELEASE_DIR}"
          if [ -f ./.release.env ]; then
            set -a
            . ./.release.env
            set +a
            docker compose -f "${COMPOSE_FILE}" ps || true
            docker compose -f "${COMPOSE_FILE}" logs --tail=200 chat-admin-panel || true
          fi
          EOF
