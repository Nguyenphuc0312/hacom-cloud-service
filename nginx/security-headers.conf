# Security headers — nguồn duy nhất, include vào TỪNG location.
#
# ⚠️ nginx: add_header trong một block con GHI ĐÈ TOÀN BỘ add_header của block
# cha. Mọi location ở default.conf.template đều có add_header Cache-Control
# riêng, nên nếu chỉ khai báo header ở cấp server thì chúng sẽ biến mất ở
# location đó. Vì vậy phải include file này vào từng location, không phải chỉ
# một lần ở cấp server.
#
# CSP:
#  - script-src 'unsafe-inline': BẮT BUỘC vì index.html có khối bootstrap theme
#    inline (tránh flash sáng/tối khi load). Nâng cấp sang nonce khi có build step.
#  - style-src 'unsafe-inline': Tailwind + CSS variables động (theme/runtimeTheme.ts).
#  - connect-src: đúng 3 backend thật (chat-api, hr-api, ai) + websocket. Không mở rộng.
#  - worker-src blob:: pdfjs-dist chạy worker từ blob URL.
#  - img-src https:: link preview kéo ảnh OG từ website BẤT KỲ người dùng gửi,
#    cộng favicon qua google.com/s2/favicons (LinkPreviewCard.tsx:49,
#    ComposerLinkPreview.tsx:53). Khoá theo danh sách host là không khả thi.
#    Ảnh không chạy được script nên nới ở đây rẻ hơn nhiều so với script-src.
#  - frame-src: KHÔNG có thì rơi về default-src 'self' và chặn mất 2 thứ đang
#    dùng thật — preview PDF/ảnh qua blob: URL, và Office Online viewer
#    (DocumentPreview.tsx:105 nhúng view.officeapps.live.com cho .docx/.xlsx).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https://chat.hacomholdings.com.vn; font-src 'self' data:; connect-src 'self' blob: https://chat.hacomholdings.com.vn wss://chat.hacomholdings.com.vn https://hrm.hacomholdings.com.vn https://ai.hacomholdings.com.vn; worker-src 'self' blob:; frame-src 'self' blob: https://view.officeapps.live.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(), usb=()" always;
# Bật khi đã chắc chắn TOÀN BỘ subdomain chạy HTTPS (bật nhầm là khoá người dùng ngoài):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
