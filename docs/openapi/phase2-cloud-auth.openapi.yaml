openapi: 3.1.0
info:
  title: Hacom Cloud Phase 2 Auth Contract
  version: 2.0.0-process1
  description: |
    Frozen HTTP authentication boundary for Phase 2 Process 1. The public
    gateway exposes /cloud-api and strips that prefix before proxying to the
    Cloud API. Business endpoint schemas remain owned by docs/api.md.
servers:
  - url: /cloud-api
    description: Same-origin Chat gateway
security:
  - hacomAccessToken: []
paths:
  /health/live:
    get:
      security: []
      operationId: cloudLiveness
      responses:
        "200":
          description: API process is alive
  /health/ready:
    get:
      security: []
      operationId: cloudReadiness
      responses:
        "200":
          description: Required Cloud dependencies are ready
        "503":
          description: A required dependency is unavailable
  /api/v1/cloud/quota:
    get:
      operationId: getCloudQuota
      responses:
        "200":
          description: Quota owned by the authenticated subject
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/cloud/items:
    get:
      operationId: listCloudItems
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          description: Items scoped to the authenticated subject
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cloud/items/{itemId}:
    get:
      operationId: getCloudItem
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item owned by the authenticated subject
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Item is missing or belongs to another subject
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/cloud/texts:
    post:
      operationId: createCloudText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Text created for the authenticated subject
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/cloud/links:
    post:
      operationId: createCloudLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                title:
                  type: string
      responses:
        "201":
          description: Link created for the authenticated subject
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
  /api/v1/cloud/uploads:
    post:
      operationId: initiateCloudUpload
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Existing idempotent upload reservation
        "201":
          description: Upload reservation created
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/AuthUnavailable"
components:
  securitySchemes:
    hacomAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access JWT issued by chat-auth-service. Verifiers pin RS256 or ES256,
        resolve kid via JWKS, verify iss/aud/exp/typ=access, require
        sub/sid/jti/iat, and enforce auth-owned session/account state.
  parameters:
    ItemId:
      in: path
      name: itemId
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RequestId:
      description: Correlation identifier generated by the trusted gateway or API
      schema:
        type: string
        maxLength: 128
  responses:
    Unauthorized:
      description: Missing, malformed, invalid, expired, wrong-type, or revoked access token
      headers:
        WWW-Authenticate:
          schema:
            type: string
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated account is not active or lacks the required capability
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AuthUnavailable:
      description: Auth session/account authority is unavailable; protected writes fail closed
      headers:
        Retry-After:
          schema:
            type: integer
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - AUTH_REQUIRED
                - INVALID_ACCESS_TOKEN
                - SESSION_REVOKED
                - ACCOUNT_NOT_ACTIVE
                - AUTH_AUTHORITY_UNAVAILABLE
                - ITEM_NOT_FOUND
            message:
              type: string
